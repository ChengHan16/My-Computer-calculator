<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活動紀實 - 立法院系統整合</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./css/authenticated.css">

    <style>
        /* --- 專業檔案外框與清單風格 --- */
        .event-content-area {
            max-width: 1100px;
            margin: 0 auto;
            width: 95%;
            padding: 40px 0;
        }

        .year-group-title {
            font-size: 1.5rem;
            color: var(--ly-blue);
            font-weight: bold;
            margin: 40px 0 20px;
            padding-left: 15px;
            border-left: 5px solid var(--ly-gold);
            display: flex;
            align-items: center;
            background: linear-gradient(90deg, rgba(0,49,83,0.05) 0%, transparent 100%);
            height: 45px;
        }

        .doc-list-item {
            background: white;
            border: 1px solid #e0e0e0;
            border-left: 6px solid var(--ly-blue);
            margin-bottom: 20px;
            padding: 22px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .doc-list-item:hover {
            transform: translateX(8px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-color: var(--ly-gold);
        }

        .doc-info h4 {
            margin: 0 0 10px 0;
            color: var(--ly-blue);
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .doc-info p {
            margin: 0;
            color: #666;
            font-size: 0.95rem;
        }

        .doc-action-hint {
            color: var(--ly-gold);
            font-weight: 900;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        /* --- 文件預覽風格彈窗 CSS --- */
        .doc-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: flex-start;
            padding-top: 50px;
            overflow-y: auto;
        }

        .doc-paper {
            background: #fff;
            width: 90%;
            max-width: 850px;
            margin-bottom: 50px;
            padding: 60px 50px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            position: relative;
            border: 1px solid #ddd;
            background-image: radial-gradient(#f0f0f0 1.5px, transparent 1.5px);
            background-size: 30px 30px;
        }

        .doc-header {
            text-align: center;
            border-bottom: 2px double var(--ly-blue);
            padding-bottom: 25px;
            margin-bottom: 40px;
        }

        .doc-watermark {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(-30deg);
            font-size: 6rem;
            color: rgba(0, 49, 83, 0.03);
            pointer-events: none;
            white-space: nowrap;
            font-weight: 900;
        }

        .doc-sub-title {
            color: var(--ly-blue);
            border-left: 5px solid var(--ly-gold);
            padding-left: 15px;
            margin: 35px 0 20px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* 投票區與按鈕 */
        .vote-panel {
            background: #fdfaf0;
            padding: 30px;
            border-radius: 10px;
            border: 1px dashed var(--ly-gold);
            text-align: center;
            margin-top: 40px;
        }

        .btn-vote {
            padding: 12px 35px;
            margin: 10px;
            border-radius: 50px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-join { background: var(--ly-blue); color: white; }
        .btn-next { background: #777; color: white; }
        .btn-join:hover { background: var(--ly-gold); transform: translateY(-3px); }

        /* 參與成員 */
        .voter-grid { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; min-height: 80px; justify-content: center;}
        .voter-box { text-align: center; width: 75px; }
        .voter-box img { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--ly-gold); object-fit: cover; background: #eee;}
        .voter-box span { display: block; font-size: 0.8rem; margin-top: 8px; font-weight: bold; color: #444; }

        .doc-close-btn {
            position: absolute;
            right: 25px; top: 25px;
            font-size: 2rem;
            cursor: pointer;
            color: #999;
            background: none; border: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="header-layout"></div>

    <div class="event-content-area">
        <h2 class="section-title">活動辦理紀實</h2>
        <div id="public-event-display"></div>
    </div>

    <div id="doc-preview-modal" class="doc-modal">
        <article class="doc-paper">
            <button class="doc-close-btn" onclick="closeDocPreview()">&times;</button>
            <div class="doc-watermark">活動檔案存查</div>
            
            <header class="doc-header">
                <h1 id="doc-title" style="color: var(--ly-blue); margin-bottom: 10px;">--</h1>
                <div style="font-size: 0.9rem; color: #666;">
                    檔案編號：<span id="doc-id">--</span> | 存檔日期：<span id="doc-date">--</span>
                </div>
            </header>

            <section id="doc-content" style="line-height: 1.8; color: #333;"></section>

            <section id="vote-area" class="vote-panel" style="display: none;">
                <h3 class="doc-sub-title">出席狀況調查</h3>
                <div class="vote-actions">
                    <button class="btn-vote btn-join" onclick="handleVote('join')">
                        <i class="fas fa-check-circle"></i> 參與
                    </button>
                    <button class="btn-vote btn-next" onclick="handleVote('next')">
                        <i class="fas fa-times-circle"></i> 下次再聚
                    </button>
                </div>
            </section>

            <section>
                <h3 class="doc-sub-title">參與成員名單</h3>
                <div id="voter-list" class="voter-grid"></div>
            </section>
        </article>
    </div>

    <div id="footer-layout"></div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="./js/dashboard.js"></script>

    <script>
        const auth = firebase.auth();
        let currentEventId = null;

        document.addEventListener("DOMContentLoaded", async () => {
            await loadLayout('events'); 
            await syncMemberData("班長", '<i class="fa-solid fa-calendar-check"></i> 院內活動籌辦', '<i class="fa-solid fa-calendar-check"></i> 立法活動辦理');

            if (typeof db !== 'undefined') {
                startPublicEventListen();
            }
        });

        function startPublicEventListen() {
            const display = document.getElementById('public-event-display');
            db.collection("events").onSnapshot(snapshot => {
                display.innerHTML = "";
                let eventsArray = [];
                
                snapshot.forEach(doc => {
                    const ev = doc.data();
                    const id = doc.id;
                    const timeField = ev.fields ? ev.fields.find(f => f.type === 'time') : null;
                    let sortDate = timeField ? new Date(timeField.content) : (ev.createdAt ? ev.createdAt.toDate() : new Date());
                    eventsArray.push({ id, ...ev, sortDate });
                });

                eventsArray.sort((a, b) => b.sortDate - a.sortDate);

                let currentYear = null;
                eventsArray.forEach(ev => {
                    const year = ev.sortDate.getFullYear();
                    if (year !== currentYear) {
                        currentYear = year;
                        display.insertAdjacentHTML('beforeend', `<div class="year-group-title">${year} 年度活動紀實</div>`);
                    }

                    const itemHtml = `
                        <div class="doc-list-item" onclick="openDocPreview('${ev.id}')">
                            <div class="doc-info">
                                <h4>${ev.title}</h4>
                                <p><i class="far fa-clock"></i> ${ev.sortDate.toLocaleString('zh-TW', { hour12: false }).replace(/\//g, '-')}</p>
                            </div>
                            <div class="doc-action-hint">詳情檔案 <i class="fas fa-file-export"></i></div>
                        </div>`;
                    display.insertAdjacentHTML('beforeend', itemHtml);
                });
            });
        }

        async function openDocPreview(id) {
            currentEventId = id;
            const doc = await db.collection("events").doc(id).get();
            const ev = doc.data();

            document.getElementById('doc-title').innerText = ev.title;
            document.getElementById('doc-id').innerText = id.substring(0, 8).toUpperCase();
            document.getElementById('doc-date').innerText = ev.formattedDate || '--';

            const contentArea = document.getElementById('doc-content');
            contentArea.innerHTML = "";

            if (ev.fields) {
                ev.fields.forEach(f => {
                    // 1. 如果內容完全等於活動大標題，則跳過不顯示，避免重複
                    if (f.content === ev.title) return; 

                    if (f.type === 'image_upload' && f.content) {
                        contentArea.innerHTML += `<div style="text-align:center; margin:20px 0;"><img src="${f.content}" style="max-width:100%; border-radius:8px; border:1px solid #eee;"></div>`;
                    } else if (f.label === '標題' || f.type === 'headline') {
                        // 2. 修正：只有標題不顯示標籤，直接顯示儲存文字內容
                        contentArea.innerHTML += `
                            <div style="margin-bottom:15px; border-bottom:1px solid #f9f9f9; padding-bottom:10px;">
                                <div style="padding-left:5px; margin-top:5px; line-height:1.6; font-size: 1.1rem;">${f.content.replace('T', ' ')}</div>
                            </div>`;
                    } else {
                        // 3. 其他標籤（時間、地點等）維持原樣顯示
                        contentArea.innerHTML += `
                            <div style="margin-bottom:15px; border-bottom:1px solid #f9f9f9; padding-bottom:10px;">
                                <strong style="color:var(--ly-blue);">[ ${f.label} ]</strong>
                                <div style="padding-left:15px; margin-top:5px;">${f.content.replace('T', ' ')}</div>
                            </div>`;
                    }
                });
            }

            // --- 偵測帳號登入隱藏/顯示視窗 ---
            auth.onAuthStateChanged(async (user) => {
                
                const themeLink = document.getElementById('dynamic-theme-css');
                
                // 1. 根據登入狀態切換 CSS 路徑
                const cssPath = user ? "./css/authenticated.css" : "./css/style.css";
                if (themeLink) themeLink.href = cssPath;

                // 2. 根據登入狀態動態載入 JS 檔案
                const scriptPath = user ? "./js/dashboard.js" : "./js/main.js";
                
                loadDynamicScript(scriptPath, async () => {
                    // 無論是否登入，都載入 Layout 與同步預設顯示文字
                    if (typeof loadLayout === "function") {
                        await loadLayout('events'); 
                    }
                    
                    // 修正：即便沒有 UID (未登入)，也要執行文字顯示
                    if (typeof syncMemberData === "function") {
                        // 這裡會執行顯示您要求的「院內活動籌辦」與「立法活動辦理」圖示文字
                        await syncMemberData("班長", 
                            '<i class="fa-solid fa-calendar-check"></i> 院內活動籌辦', 
                            '<i class="fa-solid fa-calendar-check"></i> 立法活動辦理'
                        );
                    }

                    // 啟動活動監聽
                    if (typeof db !== 'undefined') {
                        startPublicEventListen();
                    }
                });

                // 3. 控制投票視窗顯示
                const voteArea = document.getElementById('vote-area');
                if (voteArea) {
                    voteArea.style.display = user ? 'block' : 'none';
                }
            });
            // 輔助函式：動態載入 Script 並確保完成後執行回調
            function loadDynamicScript(src, callback) {
                // 避免重複載入相同腳本
                if (document.querySelector(`script[src="${src}"]`)) {
                    if (callback) callback();
                    return;
                }
                const script = document.createElement('script');
                script.src = src;
                script.onload = callback;
                document.body.appendChild(script);
            }


            loadVotes(id);
            document.getElementById('doc-preview-modal').style.display = 'flex';
        }

        function closeDocPreview() {
            document.getElementById('doc-preview-modal').style.display = 'none';
        }

        // --- 投票功能：抓取登入帳號名稱與圖片顯示在參與名單中 ---
        async function handleVote(choice) {
            const user = auth.currentUser;
            if (!user) return;

            try {
                // 從 act 集合抓取該帳號資料
                const userDoc = await db.collection("act").doc(user.uid).get();
                const userData = userDoc.data() || {};

                await db.collection("events").doc(currentEventId).collection("votes").doc(user.uid).set({
                    name: userData.displayName || user.email.split('@')[0],
                    photo: userData.photoURL || "",
                    choice: choice,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert(choice === 'join' ? "已記錄您的參與狀況：參與" : "已記錄您的參與狀況：下次再聚");
                loadVotes(currentEventId);
            } catch (error) {
                console.error("投票失敗:", error);
            }
        }

        function loadVotes(eventId) {
            const list = document.getElementById('voter-list');
            db.collection("events").doc(eventId).collection("votes")
              .where("choice", "==", "join")
              .onSnapshot(snapshot => {
                list.innerHTML = "";
                if (snapshot.empty) {
                    list.innerHTML = "<p style='color:#ccc; font-size:0.9rem;'>尚無成員參與...</p>";
                    return;
                }
                snapshot.forEach(doc => {
                    const v = doc.data();
                    list.innerHTML += `
                        <div class="voter-box">
                            <img src="${v.photo || 'https://via.placeholder.com/60'}" onerror="this.src='https://via.placeholder.com/60'">
                            <span>${v.name}</span>
                        </div>`;
                });
            });
        }

        window.toggleNav = function() {
            const sidebar = document.getElementById("mySidebar");
            const overlay = document.getElementById("overlay");
            if (sidebar && sidebar.style.width === "250px") {
                sidebar.style.width = "0";
                overlay.style.display = "none";
            } else if(sidebar) {
                sidebar.style.width = "250px";
                overlay.style.display = "block";
            }
        };

        function confirmLogout() {
            if (confirm("確定登出系統？")) {
                auth.signOut().then(() => {
                    window.location.href = "login.html";
                });
            }
        }
    </script>
</body>
</html>
